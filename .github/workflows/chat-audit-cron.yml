name: Printosky chat audit (AM/PM handoff-queue digest → Anu)

# Twice-daily customer-chat health check. Reports the human-handoff queue
# (chats the bot handed to a person — invisible to the 30-min SLA cron because
# the bot's auto-ack counts as a reply) plus any inbound unanswered > 1h, and
# messages the alert recipient (ANU_ALERT_PHONE). Vercel Hobby caps crons at
# once/day, so this runs from GitHub Actions like the other Printosky crons.
#
# 10:00 & 18:00 IST  ==  04:30 & 12:30 UTC.
#
# The step fails the job on a non-200: this endpoint already answers 500
# when it breaks, and until 2026-11-01 the step ended in `exit 0` and threw
# that away. Through the 2026-10-17 egress outage it returned errors on
# every run for fourteen days and the job stayed green.
on:
  schedule:
    - cron: "30 4,12 * * *"
  workflow_dispatch: {}        # allow manual run from the Actions tab

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Chat audit digest
        run: |
          echo "Calling chat-audit..."
          code=$(curl -s -o /tmp/audit.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://printosky.vercel.app/cron/chat-audit")
          echo "HTTP $code"; cat /tmp/audit.json || true
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::chat-audit failed with HTTP $code"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
