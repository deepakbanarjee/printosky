name: Printosky crons (SLA watchdog + abandoned book carts + store-PC watch)

# Vercel Hobby plan only allows once-per-day crons, so these 30-minute jobs are
# driven from GitHub Actions instead:
#   /cron/sla-check       — message the owner if a customer has waited > 1h
#   /cron/abandoned-carts — nudge customers who left a book order unfinished
#   /cron/store-pc-check  — per store: alert when a PC goes up/down (with
#                           day/week/month logs at closing for the main store),
#                           and when a PC is up but its printer counters have
#                           frozen — see docs/FAIL_LOUD.md
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}        # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: SLA watchdog
        run: |
          echo "Calling SLA watchdog..."
          code=$(curl -s -o /tmp/sla.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://printosky.vercel.app/cron/sla-check")
          echo "HTTP $code"; cat /tmp/sla.json || true
          exit 0
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Abandoned book carts
        run: |
          echo "Calling abandoned-cart reminder..."
          code=$(curl -s -o /tmp/cart.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://printosky.vercel.app/cron/abandoned-carts")
          echo "HTTP $code"; cat /tmp/cart.json || true
          exit 0
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Store-PC liveness watch
        run: |
          echo "Calling store-PC watcher..."
          code=$(curl -s -o /tmp/pc.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://printosky.vercel.app/cron/store-pc-check")
          echo "HTTP $code"; cat /tmp/pc.json || true
          exit 0
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
