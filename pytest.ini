[pytest]
# Only collect the real suite under tests/. Keeps bare `pytest` from scanning
# root-level scratch (_tmp_*_test.py, test_results.txt) that aborts collection.
testpaths = tests
python_files = test_*.py
markers =
    store_only: requires store PC (print_server:3005, physical printers)
    creates_data: writes real records to Supabase/jobs.db — clean up after
