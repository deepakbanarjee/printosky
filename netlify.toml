[build]
  publish   = "website"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_KEY,SUPABASE_URL,ADMIN_PBKDF2_HASH"

[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

[[redirects]]
  from   = "/superadmin"
  to     = "/superadmin.html"
  status = 200

[[redirects]]
  from   = "/mis"
  to     = "/mis.html"
  status = 200

[[redirects]]
  from   = "/dtp"
  to     = "/dtp.html"
  status = 200

[[redirects]]
  from   = "/transcripts"
  to     = "/dtp.html"
  status = 200

[[redirects]]
  from   = "/jobs"
  to     = "/jobs.html"
  status = 200

[[redirects]]
  from   = "/account"
  to     = "/account.html"
  status = 200

[[redirects]]
  from   = "/notes"
  to     = "/account.html"
  status = 200

# Enforce HTTPS. Netlify already 301s http -> https; HSTS makes the browser
# refuse plain http on its own after the first visit, so the redirect hop (and
# its downgrade window) disappears.
# Not set: `includeSubDomains` / `preload` — those bind every current and future
# subdomain to HTTPS-only and preload is effectively irreversible. Add them only
# once every subdomain is confirmed HTTPS-only.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fingerprint-free static assets: cache hard, and let a filename change bust it.
# Big LCP/repeat-visit win; HTML stays must-revalidate below so pages never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/drdivyam/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/drdivyam/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# App JS must revalidate in lockstep with the HTML that calls it. Without this,
# a browser keeps a stale admin-shared.js (or order/*.js) while loading fresh
# HTML that references new helpers → "X is not defined" version-skew errors.
[[headers]]
  for = "/admin-shared.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/order/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/superadmin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/mis"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
