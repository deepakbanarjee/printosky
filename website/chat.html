<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Printosky Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal:    #128C7E;
  --teal-dk: #0e7a6e;
  --green:   #25d366;
  --bubble-in:  #ffffff;
  --bubble-out: #dcf8c6;
  --bg:      #ece5dd;
  --bar-bg:  #f0f2f5;
  --muted:   #667781;
  --border:  #e9e9e9;
}

html, body {
  height: 100%; height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--teal);
  -webkit-tap-highlight-color: transparent;
}

/* ── LOGIN ────────────────────────────────────────────────────── */
#login {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--teal); padding: 32px 24px;
}
#login h1 { color:#fff; font-size:28px; font-weight:700; letter-spacing:.03em; margin-bottom:6px; }
#login p  { color:rgba(255,255,255,.72); font-size:14px; margin-bottom:36px; }
#pw-input {
  width:100%; max-width:320px; padding:13px 16px;
  border:none; border-radius:10px; font-size:16px;
  margin-bottom:12px; outline:none; display:block;
}
#login-btn {
  width:100%; max-width:320px; padding:14px;
  background:#fff; color:var(--teal);
  border:none; border-radius:10px; font-size:16px;
  font-weight:700; cursor:pointer; display:block;
}
#login-err { color:#ffcdd2; font-size:13px; margin-top:10px; min-height:18px; text-align:center; }

/* ── APP SHELL ─────────────────────────────────────────────────── */
#app {
  display: none; position: fixed; inset: 0;
  flex-direction: column; height: 100dvh;
}

/* ── SCREENS ───────────────────────────────────────────────────── */
#screen-list, #screen-chat {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  transition: transform 0.22s cubic-bezier(.4,0,.2,1);
}
#screen-list { background: #fff; transform: translateX(0); }
#screen-chat { background: #fff; transform: translateX(100%); }
#chat-thread { display: flex; flex-direction: column; flex: 1; min-height: 0; }
/* Placeholder is a desktop-only concept; hidden on mobile (media query re-enables it). */
#no-chat-placeholder { display: none; }
#screen-list.slide-left  { transform: translateX(-100%); }
#screen-chat.slide-in    { transform: translateX(0); }

/* ── TOP BAR ───────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 10px;
  background: var(--teal); color: #fff; flex-shrink: 0;
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  min-height: 58px;
}
.topbar-title { font-size: 18px; font-weight: 700; flex: 1; }
.topbar-sub   { font-size: 12px; opacity: .75; margin-top: 1px; }
.topbar-info  { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.topbar-info .topbar-title { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.icon-btn {
  background: none; border: none; color: #fff;
  font-size: 24px; cursor: pointer; padding: 4px 6px;
  line-height: 1; flex-shrink: 0;
}

/* ── AVATAR ────────────────────────────────────────────────────── */
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #fff;
  flex-shrink: 0; text-transform: uppercase; user-select: none;
}
.avatar-sm { width: 36px; height: 36px; font-size: 14px; }

/* ── SOS FILTER ────────────────────────────────────────────────── */
#sos-btn {
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3);
  color: #fff; border-radius: 14px; padding: 5px 11px;
  font-size: 12px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
  line-height: 1;
}
#sos-btn.active { background: #ff7043; border-color: #e64a19; }

/* ── CONTACT LIST ──────────────────────────────────────────────── */
#contact-list { flex: 1; overflow-y: auto; background: #fff; }
.contact-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.contact-item:active { background: #f0f2f5; }
.contact-body { flex: 1; min-width: 0; }
.contact-row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.contact-name {
  font-weight: 600; font-size: 15px; color: #111;
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.contact-time { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.contact-row2 { display: flex; align-items: center; margin-top: 3px; gap: 6px; }
.contact-preview {
  font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.unread-badge {
  background: var(--green); color: #fff; border-radius: 10px;
  padding: 1px 7px; font-size: 11px; font-weight: 700;
  min-width: 18px; text-align: center; flex-shrink: 0;
}
.sos-pill {
  display: inline-block; margin-left: 5px; padding: 1px 5px;
  border-radius: 8px; background: #ff7043; color: #fff;
  font-size: 10px; font-weight: 700; vertical-align: middle;
}
.empty-state { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 14px; }

/* ── MESSAGE AREA ──────────────────────────────────────────────── */
#messages {
  flex: 1; overflow-y: auto;
  padding: 10px 8px 6px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--bg);
}

.date-sep {
  align-self: center;
  background: rgba(255,255,255,.9); color: #555;
  font-size: 11px; padding: 4px 12px; border-radius: 8px;
  margin: 8px 0 4px; box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

/* Bubbles */
.bubble { max-width: 82%; display: flex; flex-direction: column; margin: 1px 8px; }
.bubble-in  { align-self: flex-start; }
.bubble-out { align-self: flex-end; }

.bubble-body {
  padding: 7px 10px 5px; font-size: 14px; line-height: 1.5;
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
  word-break: break-word; position: relative;
}
.bubble-in  .bubble-body { background: var(--bubble-in);  border-radius: 0 8px 8px 8px; }
.bubble-out .bubble-body { background: var(--bubble-out); border-radius: 8px 0 8px 8px; }

/* Tails */
.bubble-in .bubble-body::before {
  content: ''; position: absolute; top: 0; left: -7px;
  border: 7px solid transparent;
  border-top: 7px solid var(--bubble-in); border-right: 0;
}
.bubble-out .bubble-body::before {
  content: ''; position: absolute; top: 0; right: -7px;
  border: 7px solid transparent;
  border-top: 7px solid var(--bubble-out); border-left: 0;
}

/* Timestamp + ticks */
.bubble-ts {
  display: flex; align-items: center; gap: 3px;
  font-size: 11px; color: rgba(0,0,0,.38);
  margin-top: 3px; align-self: flex-end;
}
.bubble-in .bubble-ts { align-self: flex-start; }
.tick { font-size: 13px; color: #53bdeb; }

/* Media */
.msg-img-wrap { display: block; border-radius: 6px; overflow: hidden; cursor: zoom-in; line-height: 0; }
.msg-img { width: 100%; max-width: 240px; display: block; border-radius: 6px; }
.msg-caption { font-size: 13px; margin-top: 5px; }
.msg-audio { display: flex; align-items: center; gap: 8px; padding: 2px 0; min-width: 180px; }
.msg-audio audio { flex: 1; height: 32px; }
.msg-doc {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,.06); border-radius: 6px;
  padding: 8px 10px; text-decoration: none; color: inherit; min-width: 150px;
}
.msg-doc-icon { font-size: 26px; flex-shrink: 0; }
.msg-doc-name { font-size: 13px; font-weight: 600; word-break: break-all; }
.media-unavail { color: #aaa; font-style: italic; font-size: 13px; }

/* ── REPLY BAR ─────────────────────────────────────────────────── */
#reply-bar {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 10px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  background: var(--bar-bg); flex-shrink: 0;
  border-top: 1px solid var(--border);
}
.attach-btn {
  background: none; border: none; font-size: 22px;
  cursor: pointer; color: #54656f; padding: 4px; line-height: 1; flex-shrink: 0;
}
#msg-input {
  flex: 1; padding: 9px 14px; border: none; border-radius: 22px;
  font-size: 15px; outline: none; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
  max-height: 100px; overflow-y: auto; line-height: 1.4;
  resize: none; font-family: inherit;
}
.send-btn {
  background: var(--teal); color: #fff;
  border: none; border-radius: 50%;
  width: 44px; height: 44px; font-size: 20px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: background .15s;
}
.send-btn:active { background: var(--teal-dk); }
#upload-status { font-size: 11px; color: var(--muted); align-self: center; }

/* ── DESKTOP LAYOUT (≥700px) ───────────────────────────────────── */
@media (min-width: 700px) {
  html, body { background: #111; }

  #login {
    border-radius: 14px;
    max-width: 380px;
    margin: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    padding: 48px 36px;
  }

  #app {
    flex-direction: row;
    max-width: 1280px;
    margin: 0 auto;
    height: 100dvh;
    box-shadow: 0 0 60px rgba(0,0,0,.5);
  }

  /* Both screens visible side-by-side — no slide */
  #screen-list, #screen-chat {
    position: relative !important;
    transform: none !important;
    transition: none !important;
    flex-shrink: 0;
  }
  #screen-list {
    width: 340px;
    border-right: 1px solid var(--border);
    z-index: auto;
  }
  #screen-chat {
    flex: 1;
    position: relative !important;
    display: flex !important;
    flex-direction: column;
    inset: auto !important;
  }
  #chat-thread {
    flex: 1;
    min-height: 0;
  }
  /* Hide back button on desktop */
  #screen-chat .icon-btn[onclick="goBack()"] { display: none; }

  /* Wider bubbles on desktop */
  .bubble { max-width: 65%; }

  /* Bigger message input */
  #msg-input { font-size: 15px; }

  /* Contact hover instead of active */
  .contact-item:hover { background: #f0f2f5; }
  .contact-item.selected { background: #e9edef; }

  /* No-chat placeholder */
  #no-chat-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: var(--bg);
    color: var(--muted);
    gap: 14px;
    font-size: 15px;
  }
  #no-chat-placeholder .nc-icon { font-size: 64px; opacity: .4; }
  #no-chat-placeholder .nc-title { font-size: 22px; font-weight: 600; color: #333; opacity: .6; }
}

/* ── LIGHTBOX ──────────────────────────────────────────────────── */
#lightbox {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.93); align-items: center; justify-content: center; cursor: zoom-out;
}
#lightbox img { max-width: 96vw; max-height: 90dvh; object-fit: contain; border-radius: 4px; }
#lb-close {
  position: absolute; top: 14px; right: 16px;
  background: rgba(255,255,255,.15); border: none; color: #fff;
  font-size: 22px; width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <h1>📱 Printosky</h1>
  <p>WhatsApp Conversations</p>
  <input id="pw-input" type="password" placeholder="Admin password"
         autocomplete="current-password"
         onkeydown="if(event.key==='Enter') doLogin()">
  <button id="login-btn" onclick="doLogin()">Sign In</button>
  <div id="login-err"></div>
</div>

<!-- APP -->
<div id="app">

  <!-- SCREEN 1: Contact list -->
  <div id="screen-list">
    <div class="topbar">
      <div class="avatar" style="background:var(--green); font-size:18px;">💬</div>
      <span class="topbar-title">Chats</span>
      <button id="sos-btn" onclick="toggleSos()">🆘&nbsp;<span id="sos-count">0</span></button>
    </div>
    <div id="contact-list"><div class="empty-state">Loading…</div></div>
  </div>

  <!-- SCREEN 2: Chat thread -->
  <div id="screen-chat">
    <!-- shown on desktop when no contact is selected -->
    <div id="no-chat-placeholder">
      <div class="nc-icon">💬</div>
      <div class="nc-title">Printosky Chat</div>
      <div>Select a conversation to start messaging</div>
    </div>
    <div id="chat-thread" style="display:none;flex:1;flex-direction:column;height:100%">
    <div class="topbar">
      <button class="icon-btn" onclick="goBack()">&#8592;</button>
      <div id="chat-av" class="avatar avatar-sm" style="background:#aaa;">?</div>
      <div class="topbar-info">
        <div class="topbar-title" id="chat-name">—</div>
        <div class="topbar-sub"  id="chat-phone">—</div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="reply-bar">
      <button class="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
      <input type="file" id="file-input" style="display:none" onchange="handleAttach(this)">
      <textarea id="msg-input" rows="1" placeholder="Type a message…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
        oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <span id="upload-status"></span>
      <button class="send-btn" onclick="sendMsg()">&#10148;</button>
    </div>
    </div><!-- /chat-thread -->
  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLb()">
  <button id="lb-close" onclick="closeLb()">&#10005;</button>
  <img id="lb-img" src="" alt="">
</div>

<script>
'use strict';
const API = 'https://printosky.vercel.app';
let _pw = '', _phone = '', _name = '', _contacts = [];
let _sosOnly = false, _pollList = null, _pollThread = null;

function isDesktop() { return window.innerWidth >= 700; }

/* ── UTILS ──────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',hour12:true})
    : d.toLocaleDateString('en-IN', {day:'numeric',month:'short'});
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'});
}
function avatarLetter(n) { return (n||'?').trim()[0].toUpperCase(); }
function avatarColor(n) {
  const C = ['#e53935','#8e24aa','#1e88e5','#00897b','#f4511e','#6d4c41','#039be5','#43a047'];
  let h = 0; for (const c of (n||'')) h = (h*31 + c.charCodeAt(0)) & 0xffff;
  return C[h % C.length];
}

/* ── LOGIN ──────────────────────────────────────────────────── */
async function doLogin() {
  const pw  = document.getElementById('pw-input').value.trim();
  const err = document.getElementById('login-err');
  if (!pw) return;
  err.textContent = 'Verifying…';
  try {
    const r = await fetch(`${API}/admin/conversations`, {headers:{'X-Admin-Password':pw}});
    if (r.status === 401 || r.status === 403) { err.textContent = 'Wrong password.'; return; }
    if (!r.ok) { err.textContent = `Server error ${r.status}`; return; }
    _pw = pw;
    document.getElementById('login').style.display = 'none';
    const app = document.getElementById('app'); app.style.display = 'flex';
    renderContacts(await r.json());
    startListPolling();
  } catch(e) { err.textContent = 'Network error — ' + e.message; }
}

/* ── CONTACTS ───────────────────────────────────────────────── */
async function fetchContacts() {
  try {
    const r = await fetch(`${API}/admin/conversations`, {headers:{'X-Admin-Password':_pw}});
    if (!r.ok) return;
    renderContacts(await r.json());
  } catch(_) {}
}

function renderContacts(contacts) {
  _contacts = contacts;
  const sosCount = contacts.filter(c => c.needs_human).length;
  document.getElementById('sos-count').textContent = sosCount;
  const visible = _sosOnly ? contacts.filter(c => c.needs_human) : contacts;
  const el = document.getElementById('contact-list');
  if (!visible.length) {
    el.innerHTML = `<div class="empty-state">${_sosOnly ? 'No sessions need human help.' : 'No conversations yet.'}</div>`;
    return;
  }
  el.innerHTML = visible.map(c => {
    const color = avatarColor(c.name);
    return `<div class="contact-item" onclick="openChat('${esc(c.phone)}','${esc(c.name||'')}')">
      <div class="avatar" style="background:${color}">${avatarLetter(c.name)}</div>
      <div class="contact-body">
        <div class="contact-row1">
          <span class="contact-name">${esc(c.name)}${c.needs_human?'<span class="sos-pill">SOS</span>':''}</span>
          <span class="contact-time">${fmtTime(c.ts)}</span>
        </div>
        <div class="contact-row2">
          <span class="contact-preview">${esc(c.last_message||'')}</span>
          ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleSos() {
  _sosOnly = !_sosOnly;
  document.getElementById('sos-btn').classList.toggle('active', _sosOnly);
  renderContacts(_contacts);
}

/* ── OPEN / CLOSE CHAT ──────────────────────────────────────── */
function openChat(phone, name) {
  _phone = phone; _name = name;
  const av = document.getElementById('chat-av');
  av.textContent = avatarLetter(name);
  av.style.background = avatarColor(name);
  document.getElementById('chat-name').textContent  = name || phone;
  document.getElementById('chat-phone').textContent = phone;
  document.getElementById('messages').innerHTML = '<div class="empty-state">Loading…</div>';

  // Reveal the thread + hide the (desktop-only) placeholder on BOTH layouts.
  // Without this the mobile chat screen slid in showing only the placeholder.
  document.getElementById('no-chat-placeholder').style.display = 'none';
  document.getElementById('chat-thread').style.display = 'flex';

  if (isDesktop()) {
    // highlight selected contact
    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('selected'));
    const items = document.querySelectorAll('.contact-item');
    items.forEach(el => { if (el.getAttribute('onclick')?.includes(phone)) el.classList.add('selected'); });
  } else {
    document.getElementById('screen-chat').classList.add('slide-in');
    document.getElementById('screen-list').classList.add('slide-left');
  }

  clearInterval(_pollThread);
  fetchThread();
  _pollThread = setInterval(fetchThread, 20000);

  fetch(`${API}/admin/contacts/seen`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({admin_password:_pw, phone})
  }).catch(()=>{});
}

function goBack() {
  clearInterval(_pollThread); _pollThread = null;
  if (isDesktop()) {
    document.getElementById('chat-thread').style.display = 'none';
    document.getElementById('no-chat-placeholder').style.display = 'flex';
    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('selected'));
  } else {
    document.getElementById('screen-chat').classList.remove('slide-in');
    document.getElementById('screen-list').classList.remove('slide-left');
  }
  _phone = ''; _name = '';
  fetchContacts();
}

/* ── THREAD ─────────────────────────────────────────────────── */
async function fetchThread() {
  if (!_phone) return;
  try {
    const r = await fetch(`${API}/admin/thread?phone=${encodeURIComponent(_phone)}&limit=100`,
      {headers:{'X-Admin-Password':_pw}});
    if (!r.ok) return;
    renderThread(await r.json());
  } catch(_) {}
}

function renderThread(msgs) {
  const el = document.getElementById('messages');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  let lastDate = '';
  const parts = [];
  msgs.forEach(m => {
    const d = fmtDate(m.created_at);
    if (d && d !== lastDate) { parts.push(`<div class="date-sep">${d}</div>`); lastDate = d; }
    parts.push(bubble(m));
  });
  el.innerHTML = parts.join('');
  if (atBottom || msgs.length <= 15) el.scrollTop = el.scrollHeight;
}

function bubble(m) {
  const dir  = m.direction === 'outbound' ? 'out' : 'in';
  const ts   = fmtTime(m.created_at);
  const mt   = (m.message_type || 'text').toLowerCase();
  const url  = m.media_url || '';
  const tick = dir === 'out' ? '<span class="tick">✓✓</span>' : '';
  let body   = '';

  if (!mt || mt === 'text') {
    body = esc(m.body || '');
  } else if (!url) {
    body = '<span class="media-unavail">📎 Media unavailable</span>';
  } else if (mt.startsWith('image')) {
    body = `<div class="msg-img-wrap" onclick="openLb('${esc(url)}')">
              <img class="msg-img" src="${esc(url)}" loading="lazy" alt="photo">
            </div>${m.body ? `<div class="msg-caption">${esc(m.body)}</div>` : ''}`;
  } else if (mt.startsWith('audio')) {
    body = `<div class="msg-audio"><span style="font-size:24px">🎵</span>
              <audio controls src="${esc(url)}" style="flex:1;height:32px"></audio></div>`;
  } else if (mt.startsWith('video')) {
    body = `<a href="${esc(url)}" target="_blank" class="msg-doc">
              <span class="msg-doc-icon">🎬</span>
              <span class="msg-doc-name">${esc(m.filename||'video')}</span></a>`;
  } else if (mt.includes('pdf') || (m.filename||'').endsWith('.pdf')) {
    body = `<a href="${esc(url)}" target="_blank" class="msg-doc">
              <span class="msg-doc-icon">📄</span>
              <span class="msg-doc-name">${esc(m.filename||'document.pdf')}</span></a>`;
  } else {
    body = `<a href="${esc(url)}" target="_blank" class="msg-doc">
              <span class="msg-doc-icon">📎</span>
              <span class="msg-doc-name">${esc(m.filename||'file')}</span></a>`;
  }

  return `<div class="bubble bubble-${dir}">
    <div class="bubble-body">${body}</div>
    <div class="bubble-ts">${ts}${tick}</div>
  </div>`;
}

/* ── SEND ───────────────────────────────────────────────────── */
async function sendMsg() {
  const ta  = document.getElementById('msg-input');
  const msg = ta.value.trim();
  if (!msg || !_phone) return;
  ta.value = ''; ta.style.height = '';
  try {
    await fetch(`${API}/admin/send`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({admin_password:_pw, phone:_phone, message:msg})
    });
    await fetchThread();
  } catch(e) { alert('Send failed: ' + e.message); }
}

/* ── FILE ATTACH ────────────────────────────────────────────── */
async function handleAttach(input) {
  const file = input.files?.[0];
  if (!file || !_phone) { input.value=''; return; }
  input.value = '';
  const st = s => document.getElementById('upload-status').textContent = s;
  st('⬆ Uploading…');
  try {
    const tr = await fetch(`${API}/admin/upload-token`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({admin_password:_pw, filename:file.name, mime_type:file.type||'application/octet-stream'})
    });
    if (!tr.ok) throw new Error('token ' + tr.status);
    const {upload_url, storage_path} = await tr.json();
    await fetch(upload_url, {method:'PUT', headers:{'Content-Type':file.type||'application/octet-stream'}, body:file});
    st('⬆ Sending…');
    await fetch(`${API}/admin/send-file`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({admin_password:_pw, phone:_phone, storage_path, mime_type:file.type||'application/octet-stream', filename:file.name, caption:''})
    });
    st(''); await fetchThread();
  } catch(e) { st('⚠ ' + e.message); }
}

/* ── LIGHTBOX ───────────────────────────────────────────────── */
function openLb(url) { document.getElementById('lb-img').src=url; document.getElementById('lightbox').style.display='flex'; }
function closeLb()   { document.getElementById('lightbox').style.display='none'; }

/* ── POLLING ────────────────────────────────────────────────── */
function startListPolling() {
  clearInterval(_pollList);
  _pollList = setInterval(fetchContacts, 30000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { fetchContacts(); if (_phone) fetchThread(); }
});

/* ── BOOT ───────────────────────────────────────────────────── */
document.getElementById('pw-input').focus();
</script>
