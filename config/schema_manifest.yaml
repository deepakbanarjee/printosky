      status:                {type: text, nullable: false, default: "'order_received'::text"}
      advance_paid:          {type: boolean, nullable: true, default: "false"}
      balance_paid:          {type: boolean, nullable: true, default: "false"}
      advance_amount:        {type: numeric, nullable: true, default: "500"}
      balance_amount:        {type: numeric, nullable: true, default: "500"}
