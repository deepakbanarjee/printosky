# config/schema_manifest.yaml
# TASK-016 (roadmap-2026-05): single source of truth for the expected Supabase
# schema. Compared against the live database by scripts/check_schema.py.
#
# Source: live Supabase project mlhuwlnwwwxdnqafelko snapshotted 2026-05-11
# after SCHEMA_v17_help_escape.sql and SCHEMA_v18_webhook_idempotency.sql.
#
# How to update this file:
#   1. Write and apply a migration (api/migrations/SCHEMA_vNN_*.sql).
#   2. Run `python scripts/check_schema.py --dump` to rewrite this file.
#   3. Review the diff vs the previous version in the PR.
#
# DO NOT hand-edit to silence drift errors — fix the migration or the code,
# not the manifest.

version: 18
description: Live schema after SCHEMA_v17 (help escape) and SCHEMA_v18 (webhook idempotency)

views:
  # PostgreSQL views — read-only derived tables. Listed so the drift checker
  # doesn't flag them as unexpected.
  - epson_daily
  - konica_daily

# Tables with RLS DISABLED — flagged for security review (TASK-014 / security-agent).
# The manifest pins the current state; future drift checker will alert if any
# of these flip back to RLS-enabled or any RLS-enabled table flips to disabled.
rls_disabled_known:
  - project_builder_orders   # accepts Razorpay webhook + admin downloads; review needed
  - referral_credits         # referral credit ledger; service-role-only access enforced in code
  - referrers                # referrer registry; service-role-only access enforced in code

tables:

  academic_orders:
