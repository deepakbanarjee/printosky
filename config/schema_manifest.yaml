# Source: live Supabase project mlhuwlnwwwxdnqafelko, snapshotted 2026-06-08
# (after SCHEMA_v29_processed_webhooks_rls.sql). Regenerated from the live
# information_schema via the Supabase MCP.
#
# How to update this file:
#   1. Write and apply a migration (api/migrations/SCHEMA_vNN_*.sql).
#   2. Run `python scripts/check_schema.py --dump` to rewrite this file
#      (requires SUPABASE_DB_URL), or regenerate from the live schema.
#   3. Review the diff vs the previous version in the PR.
#
# DO NOT hand-edit to silence drift errors -- fix the migration or the code,
# not the manifest.

